<svg xmlns="http://www.w3.org/2000/svg" width="260" height="60" viewBox="0 0 260 60" role="img" aria-label="Play my mini games">
<defs>
  <linearGradient id="bg" gradientUnits="userSpaceOnUse" spreadMethod="reflect" x1="0" y1="0" x2="260" y2="0"><stop offset="0" stop-color="#4ff7ff"/><stop offset="0.5" stop-color="#3dffc5"/><stop offset="1" stop-color="#4ff7ff"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-260 0;260 0" dur="4s" repeatCount="indefinite"/></linearGradient>
  <linearGradient id="bg-s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="bg-c"><rect x="2" y="2" width="256" height="56" rx="28"/></clipPath>
</defs>
<rect x="2" y="2" width="256" height="56" rx="28" fill="#160f33"/>
<g clip-path="url(#bg-c)"><rect x="-80" y="0" width="60" height="60" fill="url(#bg-s)" transform="skewX(-20)"><animate attributeName="x" values="-80;320" dur="3s" repeatCount="indefinite"/></rect></g>
<rect x="2" y="2" width="256" height="56" rx="28" fill="none" stroke="url(#bg)" stroke-width="2.5"/>
<text x="130" y="37" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="17" font-weight="800" letter-spacing="0.5" fill="url(#bg)">Play my mini games</text>
</svg>
