<svg xmlns="http://www.w3.org/2000/svg" width="400" height="330" viewBox="0 0 400 330" role="img" aria-label="GitHub stats">
<defs>
  <linearGradient id="stats-bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#24164f"/><stop offset="1" stop-color="#0b0818"/></linearGradient>
  <linearGradient id="stats-rim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="330">
    <stop offset="0" stop-color="#bda6ff"/><stop offset="0.25" stop-color="#4ff7ff"/><stop offset="0.5" stop-color="#ff4fae"/><stop offset="0.75" stop-color="#3dffc5"/><stop offset="1" stop-color="#bda6ff"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 200 165;360 200 165" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="stats-glow" cx="0.5" cy="0" r="0.9"><stop offset="0" stop-color="#9f72ff" stop-opacity="0.28"/><stop offset="1" stop-color="#9f72ff" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1.5" y="1.5" width="397" height="327" rx="18" fill="url(#stats-bg)"/>
<rect x="1.5" y="1.5" width="397" height="327" rx="18" fill="url(#stats-glow)"/>
<rect x="1.5" y="1.5" width="397" height="327" rx="18" fill="none" stroke="url(#stats-rim)" stroke-width="2.2"/>
<text x="24" y="38" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="15" font-weight="800" letter-spacing="2.4" fill="#4ff7ff">GITHUB STATS</text>
