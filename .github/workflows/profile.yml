name: Refresh profile charts

# Redraws the GitHub charts on the profile README every day (and whenever the README
# changes), in Queen's lofi colours. Only writes the image files in /generated.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'generated/**'

permissions:
  contents: write

concurrency:
  group: profile-charts
  cancel-in-progress: true

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Draw stats, streak, languages, calendar and activity cards
        run: node .github/scripts/cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}

      - name: Draw the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            generated/snake.svg?color_snake=#4ff7ff&color_dots=#1b1240,#3b2a7a,#6a46c9,#bda6ff,#ff4fae

      - name: Save the new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh profile charts [skip ci]"
          git push
